<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dealcross — Escrow & Share Trading Platform</title>

    <!-- === Immediate Dark/Light Setup & Inline Styles === -->
    <script>
      (function() {
        const d = document.documentElement;
        const isDark =
          localStorage.theme === 'dark' ||
          (!('theme' in localStorage) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        // Set class
        d.classList.toggle('dark', isDark);
        d.classList.toggle('light', !isDark);
        // Inline background & text color so nothing ever flashes white
        d.style.backgroundColor = isDark ? '#0f172a' : '#ffffff';
        d.style.color = isDark ? '#ffffff' : '#1f2937';
      })();
    </script>

    <!-- SEO & Meta Tags -->
    <meta name="description" content="Dealcross is a secure platform for escrow-powered transactions, crypto & share trading, and fraud prevention." />
    <meta name="keywords" content="dealcross, escrow, crypto trading, share trading, secure deals, fintech" />
    <meta name="author" content="Dealcross Team" />
    <!-- ... your other head tags ... -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preload Your Tailwind CSS -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>

  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
